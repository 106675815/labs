<!DOCTYPE html>
<html>
<head>
<title>CWA Help Desk Appointment</title>
<meta charset="UTF-8">
<meta name="description" content="CWA Help Desk Appointment">
<meta name="keywords" content="HTML, Doctype, Head, Body, Meta, Paragraph, Headings, Strong, Emphasis">
<meta name="author" content="Duc Dat Nguyen">
<title>CWA Help Desk Appointment</title>
</head>
<body>
<img src="logo.png" alt="Swinburne Logo">
<h1>CWA Help Desk Appointment</h1>    

<p> The Help Desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday</p>
<p>Check Blackboard for when CWA tutors will be there.</p>
<form method="post" action="http://mercury.swin.edu.au/it000000/formtest.php">
    <fieldset>
        <legend>Student details</legend>
            <p>
            <label for="studentid">Student ID</label>
            <input type="text" name="studentid" id="studentid" required="required" pattern="\d{7,10}">
            </p>
            <p>
            <label for="given">Given Name</label>
            <input type="text" name="given" id="given" required="required" pattern="[a-zA-Z]+">
            <label for="family">Family Name</label>
            <input type="text" name="family" id="family" required="required" pattern="[a-zA-Z]+">
            </p>
    </fieldset>
    <fieldset>
            <legend>Your unit</legend>
            <label for="COS10011">COS10011</label>
            <input type="radio" name="COS10011" id="COS10011" value="COS10011" required="required">            
            <label for="COS60004">COS60004</label>
            <input type="radio" name="COS60004" id="COS60004" value="COS60004">            
            <label for="COS60007">COS60007</label>
            <input type="radio" name="COS60007" id="COS60007" value="COS60007">
            <p>
                <label for="tutor">Your Tutor</label>
                <select name="tutor" id="tutor" required="required">
                    <option value="">Please Select</option>
                    <option value="van_a">Ng Van A</option>
                    <option value="van_b">Ng Van B</option>
                    <option value="jane">Jane Doe</option>
                    <option value="john">John Doe</option>
                    <option value="other">Other</option>
                </select>
            </p>
    </fieldset>
    <fieldset>
        <legend>Issue</legend>
        <label for="html">HTML</label>
        <input type="checkbox" id="html" name="category[]" value="html" checked="checked">
        <label for="css">CSS</label>
        <input type="checkbox" id="css" name="category[]" value="css">
        <label for="js">JavaScript</label>
        <input type="checkbox" id="js" name="category[]" value="js">
        <label for="php">PHP</label>
        <input type="checkbox" id="php" name="category[]" value="php">
        <label for="mysql">MySQL</label>
        <input type="checkbox" id="mysql" name="category[]" value="mysql">
        <p><label for="doi">Description of Issue</label>
            <br>
            <textarea name="doi" id="doi" rows="4" cols="40" placeholder="Write description of the problem here..."></textarea>
        </p>
    </fieldset>
    <fieldset>
        <legend>Preferred Date / Time</legend>
        <label for="date">Date</label>
        <input type="text" name="date" id="date" placeholder="dd/mm/yyyy" pattern="\d{2}\/\d{2}\/\d{4}">
        <br>
        <label for="time">Time</label>
        <input type="text" name="time" id="time" placeholder="00:00" pattern="\d{2}\:\d{2}">
    </fieldset>

    <input type="submit" value="Book">
    <input type="reset" value="Reset form">
</form>
</body>
</html>
